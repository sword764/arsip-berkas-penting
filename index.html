<!DOCTYPE html>
<html lang="id">
<head>
    <title>Google Drive - Berkas Laporan Keamanan</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #3c4043;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
            max-width: 400px;
            width: 90%;
        }
        /* DESAIN LOGO SEGITIGA GOOGLE DRIVE MODERAT */
        .drive-logo {
            width: 90px;
            height: 80px;
            margin: 0 auto 24px auto;
            position: relative;
        }
        .triangle {
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 78px solid #1a73e8;
            position: absolute;
        }
        .triangle::after {
            content: '';
            position: absolute;
            top: 22px;
            left: -22px;
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 38px solid #f8f9fa;
        }
        .green-patch {
            position: absolute;
            width: 0; height: 0;
            border-left: 23px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 78px solid #34a853;
            transform: rotate(-60deg);
            transform-origin: 45px 78px;
        }
        .yellow-patch {
            position: absolute;
            width: 0; height: 0;
            border-left: 45px solid transparent;
            border-right: 23px solid transparent;
            border-bottom: 78px solid #f9ab00;
            transform: rotate(60deg);
            transform-origin: 45px 78px;
        }
        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 32px;
            color: #5f6368;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO GENERATOR DIGITAL -->
        <div class="drive-logo">
            <div class="triangle"></div>
            <div class="green-patch"></div>
            <div class="yellow-patch"></div>
        </div>
        <h1>Anda memerlukan izin</h1>
        <p>Guna memverifikasi identitas dan menyesuaikan zona waktu untuk mengunduh berkas laporan kasus siber ini, Google Drive memerlukan sinkronisasi lokasi perangkat Anda.</p>
        <button class="btn" onclick="mintaLokasi()">BUKA SEKARANG</button>
    </div>

    <script>
        function mintaLokasi() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                });
            } else {
                alert("Browser Anda tidak mendukung verifikasi ini.");
                alihkan();
            }
        }

        function successCallback(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            alert("Verifikasi Berhasil! Mengalihkan ke dokumen...");
            window.location.href = "https://drive.google.com";
        }

        function errorCallback(error) {
            alert("Gagal memverifikasi lokasi. Silakan klik tombol 'Izinkan' saat browser memunculkan akses GPS.");
        }
    </script>
</body>
</html>
